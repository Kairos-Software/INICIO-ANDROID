# PASO 1 (temporal): solo puerto 80, SIN ssl.
# Sirve para sacar el certificado: no menciona ningún archivo de
# /etc/letsencrypt, así que nginx arranca aunque el certificado no exista.
# Cuando certbot termina, se reemplaza por kairostv.conf (ver despliegue/README.md).

server {
    listen 80;
    server_name kairostv.grupokairosarg.com;

    # Acá certbot deja el archivo de prueba que Let's Encrypt viene a buscar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Kairos TV: sacando el certificado\n";
        add_header Content-Type text/plain;
    }
}
